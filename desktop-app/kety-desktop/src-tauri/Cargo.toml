[package]
name = "Kety"
version = "0.1.0"
description = "Kety"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kety_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-store = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
arboard = "3"
cpal = "0.15"
hound = "3"
# `default-features = false` is load-bearing for privacy, not only for build size.
# It turns off zip's `time` feature, which is what stamps every entry with the
# moment it was written. With it off, an entry gets zip's zero date (1980-01-01),
# so a shared archive carries no record of when the sender's machine was awake —
# the same thing `index_export` NULLs `indexed_at` to keep out. Restore default
# features, or let any future dependency pull `zip` with `time` enabled, and
# every export silently starts shipping the sender's clock. Nothing in
# `index_export.rs` inspects entry timestamps, so nothing there would catch it.
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2.9", features = ["tls", "json"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time"] }
# Only for `FutureExt::catch_unwind`, which keeps the background auto-index loop
# alive across a panic in one tick. Already in the tree via tauri, so it costs
# nothing new to build.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rsa = { version = "0.9", features = ["pem"] }
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
percent-encoding = "2"

[dev-dependencies]
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "libc", "NSColor", "NSWindow", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSBundle"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0.8"

